# see flows/utils/config_loader.py

# ===========================================================================================

dummy1: &dummy1
    TOOLS_PATH: "/tmp/llvm-20"
    CLANG: "riscv32-unknown-elf-clang"
    GCC:
    OBJDUMP: "riscv32-unknown-elf-objdump"
    NM: "riscv32-unknown-elf-nm"
    TARGET_TOOLCHAIN: "riscv32-unknown-elf"

dummy2: &dummy2
    TOOLS_PATH: "/tmp/gcc-15"
    CLANG:
    GCC: "riscv32-unknown-elf-clang"
    OBJDUMP: "riscv32-unknown-elf-objdump"
    NM: "riscv32-unknown-elf-nm"
    TARGET_TOOLCHAIN: "riscv32-unknown-elf"

# Toolchain of the targets without a my_<target>_toolchain entry below
default_toolchain:
  <<: *dummy2

# Reference toolchain used to compile the benchmarks (coremark/dhrystone)
# on every target in CI, so that performance numbers are comparable
# across targets.
